<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Scrap Harvester</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main id="app">
      <h1>Space Scrap Harvester</h1>

      <div class="container">
        <div class="column" id="robotColumn">
          <h1>Robots</h1>
        </div>

        <div class="column">
          <h1>Harvest</h1>
          <h2>Scrap: <span id="scrap">0</span></h2>
          <button id="harvest">Harvest Scrap</button>
        </div>

        <div class="column" id="upgradeColumn">
          <h1>Upgrades</h1>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
