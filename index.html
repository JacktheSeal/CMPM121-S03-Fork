<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Scrap Harvester</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main id="app">
      <h1>Space Scrap Harvester</h1>

      <div class="container">
        <div class="column">
          <h2>Robots</h2>
          <h2><span id="robots">1</span></h2>
          <p>Auto harvesting every 5 seconds</p>
          <p>Robot Cost: <span id="robotCost">10</span> Scrap</p>
          <button id="buyRobot">Buy Robot</button>
        </div>

        <div class="column">
          <h2>Harvest</h2>
          <h2>Scrap: <span id="scrap">0</span></h2>
          <button id="harvest">Harvest Scrap</button>
        </div>

        <div class="column">
          <h2>Upgrades</h2>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
